name: Deploy to AWS S3

on:
  push:
    branches: [ main ]

jobs:
  # The web viewer (web/): a static React build that runs in any browser from the bucket.
  build-viewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the viewer
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Hand the build to the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: vigil-viewer
          path: web/dist
          retention-days: 3

  # VIGIL itself is a Windows desktop app, so it cannot run in a browser. This job builds it
  # into one exe that needs nothing installed, and the viewer links to it as a download.
  build-app:
    runs-on: windows-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish the app as a single exe
        run: >
          dotnet publish VIGIL/VIGIL/VIGIL.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path publish/VIGIL.exe -DestinationPath VIGIL-win-x64.zip

      - name: Hand the zip to the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: vigil-app
          path: VIGIL-win-x64.zip
          retention-days: 3

  deploy:
    needs: [ build-viewer, build-app ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Fetch the viewer build
        uses: actions/download-artifact@v4
        with:
          name: vigil-viewer
          path: viewer-build

      - name: Fetch the built app
        uses: actions/download-artifact@v4
        with:
          name: vigil-app

      # Only the website goes on the bucket, which is public: the viewer, the fixture it falls
      # back on, and the app download. The repository itself is not uploaded, so the source,
      # the brief and the docs are not on the site.
      #
      # Nothing at the bucket root is ever deleted from here. That keeps what other things put
      # there: a real snapshot.json from the scan, and the Lambda's processed/ folder.
      #
      #   viewer/   the viewer's script, styles and pictures. Their names carry a hash of their
      #             contents, so --size-only skips the ones already there and --delete clears
      #             out old builds. --delete reaches no further than this folder.
      #   index.html                 copied with no-cache, so a new build shows straight away
      #   contract/fixture/*.json    what the viewer shows when there is no real snapshot.json
      #   download/                  the desktop app
      - name: Upload the website
        env:
          BUCKET: s3://${{ secrets.S3_BUCKET_NAME }}
        run: |
          aws s3 sync viewer-build/viewer "$BUCKET/viewer" --delete --size-only
          aws s3 cp viewer-build/index.html "$BUCKET/index.html" --cache-control no-cache
          aws s3 cp contract/fixture/snapshot.json "$BUCKET/contract/fixture/snapshot.json" --cache-control no-cache
          aws s3 cp contract/fixture/ask.json "$BUCKET/contract/fixture/ask.json" --cache-control no-cache
          aws s3 cp VIGIL-win-x64.zip "$BUCKET/download/VIGIL-win-x64.zip" \
            --content-type application/zip --cache-control no-cache
